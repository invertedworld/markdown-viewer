name: MarkdownViewer
options:
  bundleIdPrefix: com.invertedworld
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: U7KDB84YPD
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  cmark:
    url: https://github.com/swiftlang/swift-cmark
    from: "0.6.0"
targets:
  MarkdownViewer:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - target: MarkdownQuickLook
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Markdown Viewer
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
                - mkdn
              public.mime-type:
                - text/markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invertedworld.MarkdownViewer
        PRODUCT_NAME: Markdown Viewer
  MarkdownQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook
      - Shared
    dependencies:
      - package: cmark
        product: cmark-gfm
      - package: cmark
        product: cmark-gfm-extensions
      - sdk: Quartz.framework
    entitlements:
      path: QuickLook/MarkdownQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Markdown Quick Look
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invertedworld.MarkdownViewer.QuickLook
